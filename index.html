<!DOCTYPE html>
<html lang='en'>
<head>
	<meta charset='utf-8'>
	<meta name="author" content="Jack">
	<meta name="date" content="2022-12-05">
	<meta name="last revised" content="2026-04-29">
	<meta name="description" content="Async lookup w/ APIs">
	<meta name="keywords" content="CSCI 1720, JavaScript, asynchronous, fetch, ipinfo.io, Google Maps">
	<title>IP Lookup</title>
	<link rel='icon' href='media/icon.png'>
	
	<!-- Stylesheets -->
	<link rel='stylesheet' href='css/bootstrap.min.css'>

	<!-- Google Fonts -->
	<link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">

	<!-- Custom CSS -->
	<link rel='stylesheet' href='css/main.css'>

	<!-- used for map generation -->
	<!-- <script src="https://polyfill.io/v3/polyfill.min.js?features=default"></script> -->
</head>
<body>
	<h1>
		IP Lookup
		<img src="media/icon.png" alt="logo">
	</h1>
	<div class="container">
		<img src="media/icon.png" alt="icon" id="watermark">
		<div class="row">  <!-- form container -->
			<div class="col-sm-12">
				<div class="form">
					<input type="text" id="ip" placeholder="IP address" autofocus><br>
					<div class="buttons">
						<span class="span-btn" id="submit">Submit</span>
						<span class="span-btn" id="reset">Reset</span>
					</div>
				</div>
			</div>
			<hr>
		</div>
		
		<!-- Output -->
		<h2 id="outHeading"></h2>
		<div class="row" id="row2"><br>
			<div class="col-sm-6">
				<div class="output" id="output">
					<table id="ipInfo"></table>
				</div>
			</div>
			<div class="col-sm-6">
				<div id="map"></div>
			</div>
		</div>
		
		<!-- reset output button holder-->
		<div class="row">
			<div class="col-sm-12">
				<div class="buttons" id="buttons">
					<span class="span-btn" id="resetInfo">Reset</span>
				</div>
			</div>
		</div>
	</div>
	
	<!-- scripts -->
	<script src="js/bootstrap.min.js"></script>
	<script src='js/lookup.js'></script>

</html>
